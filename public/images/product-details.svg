<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="detailBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="detailShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
  </defs>

  <rect width="800" height="800" rx="32" fill="url(#detailBg)"/>

  <!-- Title -->
  <text x="400" y="65" font-family="-apple-system, sans-serif" font-size="22" font-weight="800" fill="#0f172a" text-anchor="middle">Precision Engineering &amp; Canine Safety</text>
  <text x="400" y="92" font-family="-apple-system, sans-serif" font-size="14" font-weight="500" fill="#64748b" text-anchor="middle">Every inch designed with veterinary behavioral specialists</text>

  <!-- 4 Feature Cards Grid inside SVG -->
  <!-- Card 1: Food-Safe Polymers -->
  <g filter="url(#detailShadow)" transform="translate(60, 130)">
    <rect width="320" height="270" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="25" y="25" width="56" height="56" rx="14" fill="#eff6ff"/>
    <path d="M 45 42 L 53 50 L 67 36" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="25" y="120" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Chew-Resistant Polymer</text>
    <text x="25" y="150" font-family="-apple-system, sans-serif" font-size="13" fill="#475569">
      <tspan x="25" dy="0">High-density polypropylene blend</tspan>
      <tspan x="25" dy="22">tested against heavy mastication.</tspan>
      <tspan x="25" dy="22">100% BPA, phthalate &amp; lead free.</tspan>
    </text>
    <rect x="25" y="215" width="130" height="28" rx="8" fill="#dbeafe"/>
    <text x="90" y="234" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#1e40af" text-anchor="middle">FDA FOOD-GRADE</text>
  </g>

  <!-- Card 2: Modular Twist-Lock -->
  <g filter="url(#detailShadow)" transform="translate(420, 130)">
    <rect width="320" height="270" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="25" y="25" width="56" height="56" rx="14" fill="#faf5ff"/>
    <!-- Lock icon -->
    <rect x="43" y="47" width="20" height="16" rx="4" fill="#9333ea"/>
    <path d="M 47 47 L 47 41 A 6 6 0 0 1 59 41 L 59 47" fill="none" stroke="#9333ea" stroke-width="3"/>
    <text x="25" y="120" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Easy Twist-Lock Levels</text>
    <text x="25" y="150" font-family="-apple-system, sans-serif" font-size="13" fill="#475569">
      <tspan x="25" dy="0">Start with 1 level for beginners.</tspan>
      <tspan x="25" dy="22">Stack up to 4 tiers as your dog</tspan>
      <tspan x="25" dy="22">levels up their problem-solving.</tspan>
    </text>
    <rect x="25" y="215" width="130" height="28" rx="8" fill="#f3e8ff"/>
    <text x="90" y="234" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#7e22ce" text-anchor="middle">MODULAR TIER SYSTEM</text>
  </g>

  <!-- Card 3: Non-Slip Weighted Base -->
  <g filter="url(#detailShadow)" transform="translate(60, 440)">
    <rect width="320" height="270" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="25" y="25" width="56" height="56" rx="14" fill="#f0fdf4"/>
    <circle cx="53" cy="53" r="14" stroke="#16a34a" stroke-width="3" fill="none"/>
    <path d="M 47 53 L 59 53" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>
    <text x="25" y="120" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Anti-Tip Weighted Base</text>
    <text x="25" y="150" font-family="-apple-system, sans-serif" font-size="13" fill="#475569">
      <tspan x="25" dy="0">8 high-friction silicone pads prevent</tspan>
      <tspan x="25" dy="22">sliding across hardwood, tile or carpet.</tspan>
      <tspan x="25" dy="22">Won't tip under 90-lb breeds.</tspan>
    </text>
    <rect x="25" y="215" width="130" height="28" rx="8" fill="#dcfce7"/>
    <text x="90" y="234" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">STABLE ON ANY FLOOR</text>
  </g>

  <!-- Card 4: Quick-Clean Dishwasher Safe -->
  <g filter="url(#detailShadow)" transform="translate(420, 440)">
    <rect width="320" height="270" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="25" y="25" width="56" height="56" rx="14" fill="#ecfeff"/>
    <!-- Water drop icon -->
    <path d="M 53 38 C 45 48, 43 55, 45 61 C 48 68, 58 68, 61 61 C 63 55, 61 48, 53 38 Z" fill="#0891b2"/>
    <text x="25" y="120" font-family="-apple-system, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Dishwasher Safe Clean</text>
    <text x="25" y="150" font-family="-apple-system, sans-serif" font-size="13" fill="#475569">
      <tspan x="25" dy="0">Disassembles in under 10 seconds.</tspan>
      <tspan x="25" dy="22">Top-rack dishwasher safe for easy,</tspan>
      <tspan x="25" dy="22">hygienic sanitization after meals.</tspan>
    </text>
    <rect x="25" y="215" width="140" height="28" rx="8" fill="#cffafe"/>
    <text x="95" y="234" font-family="-apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0e7490" text-anchor="middle">TOP-RACK SAFE</text>
  </g>
</svg>
