<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="topBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="topShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="800" height="800" rx="32" fill="url(#topBg)"/>

  <!-- Concentric Top View of Tower -->
  <g filter="url(#topShadow)">
    <!-- Base Layer Rim (Blue) -->
    <circle cx="400" cy="400" r="320" fill="#2563eb" stroke="#1d4ed8" stroke-width="4"/>
    <circle cx="400" cy="400" r="300" fill="#1e40af"/>

    <!-- Vault access sliders on perimeter -->
    <rect x="110" y="380" width="60" height="40" rx="10" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/>
    <rect x="630" y="380" width="60" height="40" rx="10" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/>
    <rect x="380" y="110" width="40" height="60" rx="10" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/>
    <rect x="380" y="630" width="40" height="60" rx="10" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/>

    <!-- Tier 3 Ring (Purple) -->
    <circle cx="400" cy="400" r="230" fill="#7c3aed" stroke="#6d28d9" stroke-width="3"/>
    <circle cx="400" cy="400" r="210" fill="#5b21b6"/>
    <!-- Spin tracks -->
    <path d="M 230 400 A 170 170 0 0 1 570 400" fill="none" stroke="#a78bfa" stroke-width="6" stroke-dasharray="16 12"/>
    <circle cx="280" cy="300" r="22" fill="#c4b5fd" stroke="#4c1d95" stroke-width="3"/>
    <circle cx="520" cy="300" r="22" fill="#c4b5fd" stroke="#4c1d95" stroke-width="3"/>
    <circle cx="400" cy="540" r="22" fill="#c4b5fd" stroke="#4c1d95" stroke-width="3"/>

    <!-- Tier 2 Ring (Teal) -->
    <circle cx="400" cy="400" r="145" fill="#0891b2" stroke="#0e7490" stroke-width="3"/>
    <!-- 4 Flaps -->
    <rect x="375" y="270" width="50" height="45" rx="8" fill="#67e8f9" stroke="#155e75" stroke-width="2"/>
    <rect x="375" y="485" width="50" height="45" rx="8" fill="#67e8f9" stroke="#155e75" stroke-width="2"/>
    <rect x="270" y="375" width="45" height="50" rx="8" fill="#67e8f9" stroke="#155e75" stroke-width="2"/>
    <rect x="485" y="375" width="45" height="50" rx="8" fill="#67e8f9" stroke="#155e75" stroke-width="2"/>

    <!-- Tier 1 Center Crown (Amber Rotary) -->
    <circle cx="400" cy="400" r="75" fill="#f59e0b" stroke="#d97706" stroke-width="4"/>
    <circle cx="400" cy="400" r="45" fill="#fcd34d"/>
    <circle cx="400" cy="400" r="20" fill="#b45309"/>

    <!-- Arrow indicators showing rotary motion -->
    <path d="M 390 340 A 60 60 0 0 1 445 365" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <polygon points="447,358 456,373 440,373" fill="#78350f"/>

    <path d="M 410 460 A 60 60 0 0 1 355 435" fill="none" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <polygon points="353,442 344,427 360,427" fill="#78350f"/>
  </g>

  <!-- Labels -->
  <rect x="250" y="35" width="300" height="45" rx="22" fill="#0f172a"/>
  <text x="400" y="63" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Aerial View • 360° Interaction</text>
</svg>
