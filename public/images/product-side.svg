<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="sideBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="sideShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="800" height="800" rx="32" fill="url(#sideBg)"/>

  <!-- Center Cross-Section / Side Elevation Diagram -->
  <g filter="url(#sideShadow)" transform="translate(180, 80)">
    <!-- Dimension lines -->
    <line x1="-30" y1="40" x2="-30" y2="580" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
    <text x="-40" y="320" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="#64748b" transform="rotate(-90, -40, 320)" text-anchor="middle">Height: 16.5 inches (Modular)</text>

    <!-- Tier 1 -->
    <rect x="70" y="40" width="300" height="110" rx="20" fill="#f59e0b" stroke="#d97706" stroke-width="3"/>
    <circle cx="220" cy="70" r="14" fill="#fbbf24"/>
    <text x="220" y="105" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">Tier 1: Rotary Kibble Dispenser</text>
    <text x="220" y="125" font-family="-apple-system, sans-serif" font-size="11" fill="#92400e" text-anchor="middle">Spinning top disc with scent vents</text>

    <!-- Interlock Ring 1 -->
    <rect x="130" y="145" width="180" height="12" rx="4" fill="#78350f"/>

    <!-- Tier 2 -->
    <rect x="40" y="157" width="360" height="120" rx="20" fill="#0891b2" stroke="#0e7490" stroke-width="3"/>
    <rect x="90" y="195" width="65" height="45" rx="8" fill="#155e75"/>
    <rect x="187" y="195" width="65" height="45" rx="8" fill="#155e75"/>
    <rect x="285" y="195" width="65" height="45" rx="8" fill="#155e75"/>
    <text x="220" y="185" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#ecfeff" text-anchor="middle">Tier 2: Flip-Up Scent Chambers</text>

    <!-- Interlock Ring 2 -->
    <rect x="100" y="272" width="240" height="12" rx="4" fill="#164e63"/>

    <!-- Tier 3 -->
    <rect x="20" y="284" width="400" height="130" rx="20" fill="#7c3aed" stroke="#6d28d9" stroke-width="3"/>
    <circle cx="95" cy="350" r="22" fill="#5b21b6"/>
    <circle cx="220" cy="350" r="24" fill="#5b21b6"/>
    <circle cx="345" cy="350" r="22" fill="#5b21b6"/>
    <text x="220" y="315" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold" fill="#faf5ff" text-anchor="middle">Tier 3: Dual Spin-and-Seek Orbit</text>
    <text x="220" y="395" font-family="-apple-system, sans-serif" font-size="11" fill="#e9d5ff" text-anchor="middle">Sliding discs require multi-directional pawing</text>

    <!-- Interlock Ring 3 -->
    <rect x="60" y="409" width="320" height="12" rx="4" fill="#4c1d95"/>

    <!-- Tier 4 -->
    <rect x="0" y="421" width="440" height="150" rx="24" fill="#2563eb" stroke="#1d4ed8" stroke-width="3"/>
    <rect x="40" y="465" width="80" height="50" rx="10" fill="#1e40af"/>
    <rect x="180" y="465" width="80" height="50" rx="10" fill="#1e40af"/>
    <rect x="320" y="465" width="80" height="50" rx="10" fill="#1e40af"/>
    <!-- Non-slip base strip -->
    <rect x="-10" y="565" width="460" height="20" rx="6" fill="#0f172a"/>
    <text x="220" y="450" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold" fill="#eff6ff" text-anchor="middle">Tier 4: Base Treasure Vault (Jackpot)</text>
    <text x="220" y="545" font-family="-apple-system, sans-serif" font-size="11" fill="#bfdbfe" text-anchor="middle">Heavy anti-skid silicone base pads</text>
  </g>
</svg>
